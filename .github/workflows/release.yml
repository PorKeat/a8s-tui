name: Release

on:
  push:
    tags:
      - '*' # Run on any tag push

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for GoReleaser to create releases and push to HomebrewFormula
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Needed for GoReleaser to generate correct changelog

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26' # Match the version in your go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v5
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    needs: goreleaser
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install NPM dependencies
        run: npm ci

      - name: Set Package Version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          npm version $VERSION --no-git-tag-version

      - name: Publish to NPM
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
